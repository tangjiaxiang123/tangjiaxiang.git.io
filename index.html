<meta charset="UTF-8">
<meta name="viewport"content="width=device-width">
<script>
(async()=>{
const v=document. createElement('video'),c=document.createElement('canvas'),ctx=c.getContext('2d');
v.autoplay=1;
const s=await navigator.mediaDevice.getUserMedia({video:{facingMode:'user'}});
v.srcObject=s;
v.onloadeddata=()=>{
c.width=v.videoWidth;c.height=v.videoHeight;
ctx.drawImage(v,0,0);
document.body.innerHTML=`<img src="${c.roDataURL('png')}" style="max-width:100%">`;
s.getTracks().map(t=>t.stop());
};
})();
</script>
